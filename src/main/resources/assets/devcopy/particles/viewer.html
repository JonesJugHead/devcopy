<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevCopy Particle Viewer</title>
<style>
:root {
	--bg: #14161a;
	--panel: #1c1f25;
	--panel-2: #23272f;
	--border: #323844;
	--text: #e6e8ec;
	--muted: #8b93a1;
	--accent: #5fb3ff;
	--warn: #ffb35f;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
	font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#app { display: grid; grid-template-columns: 1fr 340px; grid-template-rows: 1fr auto; height: 100vh; }
#view { position: relative; grid-row: 1; grid-column: 1; overflow: hidden; }
#view canvas { display: block; }
#hud { position: absolute; left: 12px; top: 10px; pointer-events: none; color: var(--muted); font-variant-numeric: tabular-nums; }
#hud b { color: var(--text); }
#error { position: absolute; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; color: var(--warn); }
#side { grid-row: 1 / span 2; grid-column: 2; background: var(--panel); border-left: 1px solid var(--border); overflow-y: auto; padding: 12px 14px; }
#bar { grid-row: 2; grid-column: 1; background: var(--panel); border-top: 1px solid var(--border); padding: 8px 12px; }
h1 { font-size: 15px; margin: 0 0 4px; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
.meta { color: var(--muted); word-break: break-word; }
.row { display: flex; align-items: center; gap: 8px; margin: 6px 0; flex-wrap: wrap; }
.row label { color: var(--muted); }
button, select, input[type=number] { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
	border-radius: 6px; padding: 4px 9px; font: inherit; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: var(--accent); color: #0b1220; border-color: var(--accent); }
input[type=range] { width: 100%; accent-color: var(--accent); }
#timeline { width: 100%; height: 34px; display: block; cursor: pointer; }
.controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.controls .grow { flex: 1; }
#info { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; min-height: 40px; }
#info table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
#info td { padding: 2px 4px; vertical-align: top; }
#info td:first-child { color: var(--muted); white-space: nowrap; }
#info pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; border: 1px solid #0006; }
.types label { display: flex; gap: 6px; align-items: center; margin: 2px 0; }
.note { color: var(--warn); }
kbd { background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; font-size: 11px; }
@media (max-width: 760px) {
	#app { grid-template-columns: 1fr; grid-template-rows: 55vh auto auto; height: auto; }
	#view { grid-row: 1; height: 55vh; }
	#bar { grid-row: 2; }
	#side { grid-row: 3; grid-column: 1; border-left: 0; border-top: 1px solid var(--border); }
}
</style>
<script type="importmap">
{ "imports": {
	"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
	"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
	<div id="view">
		<div id="hud"></div>
		<div id="error"></div>
	</div>
	<div id="bar">
		<canvas id="timeline"></canvas>
		<input id="slider" type="range" min="0" max="0" value="0">
		<div class="controls">
			<button id="prev" title="Previous frame (←)">◀︎</button>
			<button id="play" title="Play / pause (space)">▶︎ Play</button>
			<button id="next" title="Next frame (→)">▶︎</button>
			<label>Speed <select id="speed">
				<option value="0.1">0.1×</option><option value="0.25">0.25×</option><option value="0.5">0.5×</option>
				<option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
			</select></label>
			<label>Ticks/frame <select id="group">
				<option value="1">1</option><option value="2" selected>2</option><option value="4">4</option>
			</select></label>
			<span class="grow"></span>
			<label><input id="loop" type="checkbox" checked> loop</label>
		</div>
	</div>
	<aside id="side">
		<h1>Particle Viewer</h1>
		<div class="meta" id="meta"></div>

		<h2>Display</h2>
		<div class="row"><label><input id="trails" type="checkbox"> Trails</label>
			<label>over <input id="trailLen" type="number" min="1" max="200" value="10" style="width:60px"> frames</label></div>
		<div class="row"><label><input id="trailLines" type="checkbox" checked> Connect points of the same rank</label></div>
		<div class="row"><label><input id="velocity" type="checkbox"> Velocity vectors (count = 0)</label></div>
		<div class="row"><label>Size</label><input id="size" type="range" min="0.25" max="4" step="0.05" value="1" style="width:140px"></div>
		<div class="row"><button id="focus">Recenter camera</button></div>

		<h2>Types</h2>
		<div class="types" id="types"></div>

		<h2>Selection</h2>
		<div id="info"><span class="meta">Click a point.</span></div>

		<h2>Shortcuts</h2>
		<div class="meta"><kbd>space</kbd> play, <kbd>←</kbd>/<kbd>→</kbd> step, <kbd>T</kbd> trails.
			Left click: rotate, wheel: zoom, right click: pan.</div>
	</aside>
</div>

<script>
// Data injected by DevCopy
window.CAPTURE = /*__CAPTURE_DATA__*/null;
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const D = window.CAPTURE;
const $ = id => document.getElementById(id);
// Columns of the compact format (see ParticleExporter.viewer)
const C = { tick: 0, ms: 1, type: 2, x: 3, y: 4, z: 5, dx: 6, dy: 7, dz: 8, sx: 9, sy: 10, sz: 11,
	count: 12, flags: 13, rgb: 14, rgbTo: 15, scale: 16, opt: 17, rand: 18, seq: 19 };
const RANDOM = ['DEFAULT', 'ALTERNATIVE', 'ALTERNATIVE_WITH_SPEED'];

if (!D) {
	$('error').style.display = 'grid';
	$('error').textContent = 'No capture data in this file.';
	throw new Error('no data');
}

const P = D.p;
const maxTick = P.length ? Math.max(D.meta.durationTicks, P[P.length - 1][C.tick]) : D.meta.durationTicks;

// ---------------------------------------------------------------- meta

const m = D.meta;
$('meta').innerHTML = `${esc(m.server)} · ${esc(m.dimension)}<br>${esc(m.startedAt.replace('T', ' ').slice(0, 19))}<br>`
	+ `<b>${m.totalPackets}</b> packets, ${m.totalSpawned} particles, ${m.durationTicks} ticks (${(m.durationMs / 1000).toFixed(1)} s)<br>`
	+ `Origin (${m.origin.x.toFixed(2)}, ${m.origin.y.toFixed(2)}, ${m.origin.z.toFixed(2)})`
	+ (m.directionalPackets ? `<br><span class="note">${m.directionalPackets} packet(s) with count = 0: offsets = direction</span>` : '')
	+ (D.events.length ? `<br>${D.events.length} level event(s)` : '');

// ---------------------------------------------------------------- colors

const typeColor = D.types.map(t => {
	let h = 0;
	for (const ch of t) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
	return new THREE.Color().setHSL((h % 360) / 360, 0.65, 0.6);
});
function colorOf(row, t = 0) {
	if (row[C.rgb] < 0) return typeColor[row[C.type]].clone();
	const c = new THREE.Color(row[C.rgb]);
	if (row[C.rgbTo] >= 0 && t > 0) c.lerp(new THREE.Color(row[C.rgbTo]), t);
	return c;
}
const hex = n => '#' + (n & 0xffffff).toString(16).padStart(6, '0');

// ---------------------------------------------------------------- filtres de type

const typeEnabled = D.types.map(() => true);
const counts = D.types.map(() => 0);
for (const r of P) counts[r[C.type]]++;
$('types').innerHTML = D.types.map((t, i) =>
	`<label><input type="checkbox" data-i="${i}" checked><span class="swatch" style="background:${'#' + typeColor[i].getHexString()}"></span>`
	+ `${esc(t.replace('minecraft:', ''))} <span class="meta">(${counts[i]})</span></label>`).join('');
$('types').addEventListener('change', e => {
	typeEnabled[+e.target.dataset.i] = e.target.checked;
	render();
});

// ---------------------------------------------------------------- scene

const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);
const camera = new THREE.PerspectiveCamera(55, 1, 0.01, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Ground: one-block grid at Y = 0 (player's feet)
const grid = new THREE.GridHelper(32, 32, 0x55607a, 0x353c4a);
scene.add(grid);
scene.add(new THREE.AxesHelper(1.5));
// Player (0.6 × 1.8) at the origin
const player = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.8, 0.6),
	new THREE.MeshBasicMaterial({ color: 0x5fb3ff, wireframe: true, transparent: true, opacity: 0.35 }));
player.position.y = 0.9;
scene.add(player);

const sphere = new THREE.IcosahedronGeometry(1, 1);
const MAX_INSTANCES = 1 << 16;
const mat = new THREE.MeshBasicMaterial({ color: 0xffffff });
let mesh = new THREE.InstancedMesh(sphere, mat, MAX_INSTANCES);
mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
mesh.count = 0;
mesh.frustumCulled = false;
scene.add(mesh);
let meshRows = []; // instanceId -> index in P

const lineMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.55 });
const lines = new THREE.LineSegments(new THREE.BufferGeometry(), lineMat);
scene.add(lines);
const velMat = new THREE.LineBasicMaterial({ color: 0xffb35f });
const velLines = new THREE.LineSegments(new THREE.BufferGeometry(), velMat);
scene.add(velLines);

const highlight = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1),
	new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true }));
highlight.visible = false;
scene.add(highlight);

// Visual scale: a dust of scale 1 is about 0.1 block in game
const BASE_RADIUS = 0.05;

function resize() {
	const w = view.clientWidth, h = view.clientHeight;
	renderer.setSize(w, h);
	camera.aspect = w / Math.max(h, 1);
	camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);

function focusCamera() {
	const box = new THREE.Box3();
	box.expandByPoint(new THREE.Vector3(0, 0, 0));
	box.expandByPoint(new THREE.Vector3(0, 1.8, 0));
	for (const r of P) box.expandByPoint(new THREE.Vector3(r[C.x], r[C.y], r[C.z]));
	const center = box.getCenter(new THREE.Vector3());
	const size = Math.max(box.getSize(new THREE.Vector3()).length(), 2);
	controls.target.copy(center);
	camera.position.copy(center).add(new THREE.Vector3(size * 0.6, size * 0.55, size * 0.75));
	camera.near = Math.max(0.02, size / 200);
	camera.far = size * 50;
	camera.updateProjectionMatrix();
	grid.position.set(Math.round(center.x), 0, Math.round(center.z));
}
$('focus').onclick = focusCamera;

// ---------------------------------------------------------------- frames

let group = 2, frames = [], frame = 0;

function buildFrames() {
	const n = Math.floor(maxTick / group) + 1;
	frames = Array.from({ length: n }, () => []);
	for (let i = 0; i < P.length; i++) frames[Math.floor(P[i][C.tick] / group)].push(i);
	$('slider').max = n - 1;
	drawTimeline();
}

function visible(i) {
	return typeEnabled[P[i][C.type]];
}

const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpS = new THREE.Vector3(), tmpP = new THREE.Vector3();
const bg = new THREE.Color(0x14161a);

function render() {
	const trails = $('trails').checked;
	const len = trails ? Math.max(1, +$('trailLen').value) : 0;
	const sizeMul = +$('size').value;
	let k = 0;
	meshRows = [];
	const linePos = [], lineCol = [];
	const velPos = [];

	// From oldest to newest, the current frame last
	let prevRanks = null;
	for (let age = len; age >= 0; age--) {
		const f = frame - age;
		if (f < 0) { prevRanks = null; continue; }
		const fade = trails ? 1 - age / (len + 1) : 1;
		const ranks = [];
		for (const i of frames[f]) {
			if (!visible(i) || k >= MAX_INSTANCES) continue;
			const r = P[i];
			const scale = r[C.scale] > 0 ? r[C.scale] : 1;
			const rad = BASE_RADIUS * scale * sizeMul * (age === 0 ? 1 : 0.55 + 0.45 * fade);
			tmpP.set(r[C.x], r[C.y], r[C.z]);
			tmpS.setScalar(rad);
			tmpM.compose(tmpP, tmpQ, tmpS);
			mesh.setMatrixAt(k, tmpM);
			// Transitions move towards their end color as they age
			const col = colorOf(r, r[C.rgbTo] >= 0 ? age / (len + 1) : 0);
			if (age > 0) col.lerp(bg, 0.75 * (1 - fade));
			mesh.setColorAt(k, col);
			meshRows.push(i);
			ranks.push(i);
			k++;
			if ($('velocity').checked && r[C.count] === 0 && age === 0) {
				const v = 10; // display scale: displacement over ~10 ticks without drag
				velPos.push(r[C.x], r[C.y], r[C.z],
					r[C.x] + r[C.dx] * r[C.sx] * v, r[C.y] + r[C.dy] * r[C.sy] * v, r[C.z] + r[C.dz] * r[C.sz] * v);
			}
		}
		if (trails && $('trailLines').checked && prevRanks && prevRanks.length === ranks.length) {
			for (let j = 0; j < ranks.length; j++) {
				const a = P[prevRanks[j]], b = P[ranks[j]];
				linePos.push(a[C.x], a[C.y], a[C.z], b[C.x], b[C.y], b[C.z]);
				const ca = colorOf(a).lerp(bg, 0.6 * (1 - fade)), cb = colorOf(b).lerp(bg, 0.6 * (1 - fade));
				lineCol.push(ca.r, ca.g, ca.b, cb.r, cb.g, cb.b);
			}
		}
		prevRanks = ranks;
	}
	mesh.count = k;
	mesh.instanceMatrix.needsUpdate = true;
	if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
	mesh.computeBoundingSphere();
	lines.geometry.dispose();
	lines.geometry = new THREE.BufferGeometry();
	lines.geometry.setAttribute('position', new THREE.Float32BufferAttribute(linePos, 3));
	lines.geometry.setAttribute('color', new THREE.Float32BufferAttribute(lineCol, 3));
	velLines.geometry.dispose();
	velLines.geometry = new THREE.BufferGeometry();
	velLines.geometry.setAttribute('position', new THREE.Float32BufferAttribute(velPos, 3));

	const t0 = frame * group, t1 = t0 + group - 1;
	const cur = frames[frame] || [];
	const evs = D.events.filter(e => e[0] >= t0 && e[0] <= t1).length;
	$('hud').innerHTML = `Frame <b>${frame}</b> / ${frames.length - 1} · tick${group > 1 ? 's' : ''} <b>${t0}${group > 1 ? '–' + t1 : ''}</b>`
		+ ` · <b>${cur.length}</b> packet${cur.length > 1 ? 's' : ''}` + (evs ? ` · ${evs} level event(s)` : '')
		+ (playing ? ' · ▶︎' : ' · ❚❚');
	$('slider').value = frame;
	drawTimeline();
}

// ---------------------------------------------------------------- timeline

function drawTimeline() {
	const cv = $('timeline'), w = cv.clientWidth, h = cv.clientHeight;
	cv.width = w * devicePixelRatio;
	cv.height = h * devicePixelRatio;
	const g = cv.getContext('2d');
	g.scale(devicePixelRatio, devicePixelRatio);
	g.clearRect(0, 0, w, h);
	const n = frames.length || 1;
	const maxCount = Math.max(1, ...frames.map(f => f.length));
	const bw = w / n;
	for (let f = 0; f < n; f++) {
		if (!frames[f].length) continue;
		const bh = Math.max(2, (frames[f].length / maxCount) * (h - 4));
		g.fillStyle = '#3d6d99';
		g.fillRect(f * bw, h - bh, Math.max(1, bw - (bw > 3 ? 1 : 0)), bh);
	}
	g.fillStyle = '#ffb35f';
	for (const e of D.events) g.fillRect(Math.floor(e[0] / group) * bw, 0, Math.max(1, bw), 3);
	g.fillStyle = '#ffffff';
	g.fillRect(frame * bw + bw / 2 - 1, 0, 2, h);
}
$('timeline').addEventListener('pointerdown', e => {
	const rect = e.target.getBoundingClientRect();
	setFrame(Math.floor((e.clientX - rect.left) / rect.width * frames.length));
});

// ---------------------------------------------------------------- playback

let playing = false, acc = 0, last = performance.now();

function setFrame(f) {
	frame = Math.max(0, Math.min(frames.length - 1, f));
	render();
}
function setPlaying(p) {
	playing = p;
	$('play').textContent = p ? '❚❚ Pause' : '▶︎ Play';
	$('play').classList.toggle('on', p);
	render();
}

$('play').onclick = () => setPlaying(!playing);
$('prev').onclick = () => { setPlaying(false); setFrame(frame - 1); };
$('next').onclick = () => { setPlaying(false); setFrame(frame + 1); };
$('slider').oninput = e => setFrame(+e.target.value);
$('group').onchange = e => {
	const tick = frame * group;
	group = +e.target.value;
	buildFrames();
	setFrame(Math.floor(tick / group));
};
for (const id of ['trails', 'trailLen', 'trailLines', 'velocity', 'size']) $(id).addEventListener('input', render);
addEventListener('keydown', e => {
	if (e.target.tagName === 'INPUT' && e.target.type !== 'range' && e.target.type !== 'checkbox') return;
	if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
	else if (e.code === 'ArrowLeft') { e.preventDefault(); setPlaying(false); setFrame(frame - 1); }
	else if (e.code === 'ArrowRight') { e.preventDefault(); setPlaying(false); setFrame(frame + 1); }
	else if (e.key === 't' || e.key === 'T') { $('trails').checked = !$('trails').checked; render(); }
});

function loop(now) {
	const dt = now - last;
	last = now;
	if (playing) {
		acc += dt * +$('speed').value;
		const frameMs = 50 * group;
		let advanced = false;
		while (acc >= frameMs) {
			acc -= frameMs;
			if (frame + 1 >= frames.length) {
				if ($('loop').checked) frame = 0;
				else { setPlaying(false); break; }
			} else frame++;
			advanced = true;
		}
		if (advanced) render();
	} else acc = 0;
	controls.update();
	renderer.render(scene, camera);
	requestAnimationFrame(loop);
}

// ---------------------------------------------------------------- selection

const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => downAt = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
	if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4) return;
	const rect = renderer.domElement.getBoundingClientRect();
	ndc.set((e.clientX - rect.left) / rect.width * 2 - 1, -(e.clientY - rect.top) / rect.height * 2 + 1);
	ray.setFromCamera(ndc, camera);
	const hit = ray.intersectObject(mesh)[0];
	if (hit && hit.instanceId != null) select(meshRows[hit.instanceId]);
});

function select(i) {
	const r = P[i];
	const scale = r[C.scale] > 0 ? r[C.scale] : 1;
	highlight.position.set(r[C.x], r[C.y], r[C.z]);
	highlight.scale.setScalar(BASE_RADIUS * scale * +$('size').value * 1.8);
	highlight.visible = true;
	const flags = r[C.flags];
	const color = r[C.rgb] >= 0
		? `<span class="swatch" style="background:${hex(r[C.rgb])}"></span> ${hex(r[C.rgb])} ${rgbText(r[C.rgb])}`
			+ (r[C.rgbTo] >= 0 ? ` → <span class="swatch" style="background:${hex(r[C.rgbTo])}"></span> ${hex(r[C.rgbTo])} ${rgbText(r[C.rgbTo])}` : '')
		: '—';
	const abs = (v, o) => (v + o).toFixed(3);
	const rows = [
		['Type', esc(D.types[r[C.type]])],
		['Tick', `${r[C.tick]} (+${r[C.ms]} ms) · packet #${r[C.seq]}`],
		['Color', color],
		['Scale', r[C.scale] >= 0 ? r[C.scale] : '—'],
		['Relative position', `${r[C.x]}, ${r[C.y]}, ${r[C.z]}`],
		['Absolute position', `${abs(r[C.x], m.origin.x)}, ${abs(r[C.y], m.origin.y)}, ${abs(r[C.z], m.origin.z)}`],
		['Dist', `${r[C.dx]}, ${r[C.dy]}, ${r[C.dz]}`],
		['Speed', `${r[C.sx]}, ${r[C.sy]}, ${r[C.sz]}`],
		['Count', r[C.count] === 0
			? '0 <span class="note">— dist = direction, velocity = (' + [r[C.dx] * r[C.sx], r[C.dy] * r[C.sy], r[C.dz] * r[C.sz]].map(v => +v.toFixed(4)).join(', ') + ')</span>'
			: r[C.count]],
		['Randomization', RANDOM[r[C.rand]]],
		['overrideLimiter', !!(flags & 1)],
		['alwaysShow', !!(flags & 2)],
	];
	let opts = D.options[r[C.opt]];
	try { opts = JSON.stringify(JSON.parse(opts), null, 1); } catch (_) {}
	$('info').innerHTML = '<table>' + rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('') + '</table>'
		+ `<pre>${esc(opts)}</pre>`;
}

function rgbText(n) {
	return `(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255})`;
}
function esc(s) {
	return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// ---------------------------------------------------------------- go

resize();
buildFrames();
focusCamera();
render();
requestAnimationFrame(loop);
window.__viewerReady = true;
window.__viewer = { select, setFrame, setPlaying, get frame() { return frame; } };
</script>
<script>
// If three.js could not be loaded (offline), the module does not run
setTimeout(() => {
	if (!window.__viewerReady) {
		const e = document.getElementById('error');
		e.style.display = 'grid';
